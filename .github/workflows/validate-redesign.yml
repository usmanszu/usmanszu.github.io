name: Validate redesigned website
on:
  push:
    branches: [redesign-academic-homepage]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build Jekyll website
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
